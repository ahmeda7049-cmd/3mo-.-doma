<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة التعبان - 3mo Doma</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:sans-serif;text-align:center}
h1{margin:10px 0 0} p{color:#94a3b8}
canvas{background:#1e293b;border:3px solid #22c55e;border-radius:12px;margin-top:10px;max-width:95vw}
button{background:#22c55e;border:none;color:white;padding:12px 18px;margin:5px;border-radius:10px;font-size:18px}
.controls{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<h1>🐍 التعبان</h1>
<p>النقاط: <span id="score">0</span> | أحسن نتيجة: <span id="best">0</span></p>
<canvas id="game" width="400" height="400"></canvas>
<br>
<button onclick="startGame()">ابدأ من جديد 🔄</button>
<div class="controls">
<button onclick="changeDir('up')">⬆️</button>
</div>
<div class="controls">
<button onclick="changeDir('left')">⬅️</button>
<button onclick="changeDir('down')">⬇️</button>
<button onclick="changeDir('right')">➡️</button>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let snake,food,dx,dy,score,best=localStorage.getItem('best')||0,gameInterval;
document.getElementById('best').innerText=best;
function startGame(){
  snake=[{x:200,y:200},{x:180,y:200},{x:160,y:200}];
  dx=20;dy=0;score=0;
  document.getElementById('score').innerText=0;
  placeFood();
  clearInterval(gameInterval);
  gameInterval=setInterval(draw,120);
}
function placeFood(){
  food={x:Math.floor(Math.random()*20)*20,y:Math.floor(Math.random()*20)*20};
}
function changeDir(d){
  if(d=='up'&&dy==0){dx=0;dy=-20}
  if(d=='down'&&dy==0){dx=0;dy=20}
  if(d=='left'&&dx==0){dx=-20;dy=0}
  if(d=='right'&&dx==0){dx=20;dy=0}
}
document.addEventListener('keydown',e=>{
  if(e.key=='ArrowUp')changeDir('up');
  if(e.key=='ArrowDown')changeDir('down');
  if(e.key=='ArrowLeft')changeDir('left');
  if(e.key=='ArrowRight')changeDir('right');
});
function draw(){
  ctx.fillStyle='#1e293b';ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#ef4444';ctx.fillRect(food.x,food.y,20,20);
  ctx.fillStyle='#22c55e';
  snake.forEach((s,i)=>{ctx.fillRect(s.x,s.y,19,19)});
  let head={x:snake[0].x+dx,y:snake[0].y+dy};
  if(head.x<0||head.x>=400||head.y<0||head.y>=400||snake.some(s=>s.x==head.x&&s.y==head.y)){
    clearInterval(gameInterval);
    alert('خسرت! نقاطك: '+score);
    if(score>best){best=score;localStorage.setItem('best',best);document.getElementById('best').innerText=best}
    return;
  }
  snake.unshift(head);
  if(head.x==food.x&&head.y==food.y){score+=10;document.getElementById('score').innerText=score;placeFood();}
  else{snake.pop();}
}
startGame();
</script>
</body>
  </html>
